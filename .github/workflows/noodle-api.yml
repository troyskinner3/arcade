name: Noodle takes service
# Tests and deploys noodle-api/ to Cloudflare when it changes. Needs the repository secret CLOUDFLARE_API_TOKEN
# (Workers Scripts: Edit, Workers R2 Storage: Edit); without it the deploy step is skipped.
on:
  push:
    branches: [main]
    paths: ['noodle-api/**', '.github/workflows/noodle-api.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: noodle-api } }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          npx --yes wrangler@4 r2 bucket create noodle-takes || true
          npx --yes wrangler@4 deploy
