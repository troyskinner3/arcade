name: Noodle takes service (tests)
# Runs the tests for noodle-api/ when it changes. This repo does NOT deploy it: the deploy runs from the Fan to See repo
# (Persnickety-Games/fantasy-lab, .github/workflows/noodle-takes.yml), which already holds the Cloudflare token.
on:
  push:
    branches: [main]
    paths: ['noodle-api/**', '.github/workflows/noodle-api.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: noodle-api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
