# Noodle takes service (see src/index.js). Its own Worker and its own KV namespace, separate from Fan to See.
name = "noodle-takes"
main = "src/index.js"
account_id = "5649ad1dfbf6102845b7facae8598e7b"
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = false
keep_vars = true   # variables set in the Cloudflare dashboard (APPLE_APP_ID, APP_STORE_ID, APP_STORE_URL) survive each deploy

# Free-plan storage (no card): the deploy workflow finds or creates this namespace and fills in its id.
[[kv_namespaces]]
binding = "TAKES_KV"
id = "KV_NAMESPACE_ID"
[vars]
CF_ACCOUNT_ID = "5649ad1dfbf6102845b7facae8598e7b"   # for reading usage counts (GET /v1/admin/stats); the token is the ANALYTICS_TOKEN secret

# Usage counts (POST /v1/events): Workers Analytics Engine, free plan 100,000 points a day, kept 3 months. Created on the first write.
[[analytics_engine_datasets]]
binding = "EVENTS"
dataset = "noodle_events"
# ADMIN_KEY is a secret: set it in the dashboard (never in this file)

# Email to the owner when a song is reported (optional). Needs Cloudflare Email Routing turned on for a domain on this account (e.g. tuttii.io)
# and the owner's address added there as a verified destination. Then uncomment the binding and set REPORT_FROM (an address on that domain,
# e.g. noodle@tuttii.io) and REPORT_TO (the verified address) under Settings → Variables. Without it, reports still show in GET /v1/admin/reports.
# [[send_email]]
# name = "REPORT_MAIL"
